name: Build Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "code"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller UI_ComplexCalc.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ComplexCalc-windows
          path: "code/dist/UI_ComplexCalc.exe"

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "code"
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python's Linux builds don't bundle Tcl/Tk, so we use
      # the runner's system Python (which apt's python3-tk hooks into).
      - name: Install system Python + Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build executable
        run: pyinstaller UI_ComplexCalc.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ComplexCalc-linux
          path: "code/dist/UI_ComplexCalc"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "artifacts/ComplexCalc-windows/UI_ComplexCalc.exe" \
            "artifacts/ComplexCalc-linux/UI_ComplexCalc" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }} — Polar Update" \
            --generate-notes
